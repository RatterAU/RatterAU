<svg xmlns="http://www.w3.org/2000/svg" width="380" height="400" viewBox="0 0 380 400" role="img" aria-label="Bookie — a printed docket for Sale race 1, ticket 140: one hundred dollars the win on number 3 Rainy Night at 1.95, paying $195, above the board prices it was written off">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101317"/>
      <stop offset="1" stop-color="#191D23"/>
    </linearGradient>
    <clipPath id="card"><rect width="380" height="400" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="380" height="400" fill="url(#bg)"/>

    <!-- the docket, as the paper stacks it -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
      <rect x="52" y="34" width="288" height="234" rx="4" fill="#000000" fill-opacity="0.4"/>
      <rect x="46" y="26" width="288" height="234" rx="4" fill="#FDFDFB"/>
      <text x="190" y="56" font-size="13" font-weight="700" letter-spacing="1.2" fill="#5B6169">SALE &#183; RACE 1</text>
      <text x="190" y="88" font-size="24" font-weight="700" fill="#171A1F">TICKET 140</text>
      <path d="M66 104H314" stroke="#171A1F" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="190" y="136" font-size="24" font-weight="700" fill="#171A1F">#3 RAINY NIGHT</text>
      <text x="190" y="166" font-size="18" font-weight="500" fill="#171A1F">$100 WIN @ 1.95</text>
      <path d="M66 184H314" stroke="#171A1F" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="190" y="206" font-size="13" font-weight="600" letter-spacing="0.8" fill="#5B6169">IF WINS PAYS</text>
      <text x="190" y="242" font-size="34" font-weight="700" fill="#0D7047">$195</text>
    </g>

    <!-- the board it was written off -->
    <text x="30" y="304" font-family="ui-sans-serif, -apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6BFF1A" fill-opacity="0.85">OFF THE BOARD</text>
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="152" y="332" font-size="12" font-weight="900" letter-spacing="0.6" fill="#8E98A8" text-anchor="middle">WIN</text>
      <text x="290" y="332" font-size="12" font-weight="900" letter-spacing="0.6" fill="#8E98A8" text-anchor="middle">PLACE</text>

      <circle cx="54" cy="360" r="26" fill="#C71F1A"/>
      <text x="54" y="371" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>

      <rect x="94" y="336" width="256" height="48" rx="10" fill="#0F0F0F"/>
      <rect x="220" y="336" width="4" height="48" fill="#9E9E9E"/>
      <text x="157" y="370" font-size="29" font-weight="900" fill="#6BFF1A" text-anchor="middle">1.95</text>
      <text x="287" y="370" font-size="29" font-weight="900" fill="#FFDE0D" text-anchor="middle">1.12</text>
    </g>
  </g>
</svg>
